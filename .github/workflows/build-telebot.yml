name: Build telebot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download + reassemble source from release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src && cd src
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/src-v2" --jq '.assets[] | select(.name | startswith("tbpart_")) | .browser_download_url' | sort > urls.txt
          i=0
          while read -r url; do
            i=$((i+1))
            echo "downloading chunk $i"
            curl -sL -o "part_$(printf %03d $i)" "$url"
          done < urls.txt
          cat part_* > all.tar.gz
          tar -xzf all.tar.gz
          ls

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build telebot debug APK
        run: |
          cd src
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telebot-apk
          path: src/TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src
          APK=$(ls TMessagesProj_App/build/outputs/apk/afat/debug/*.apk | head -1)
          gh release create apk-latest "$APK" --title "telebot APK" --notes "Latest telebot build (debug)" || gh release upload apk-latest "$APK" --clobber
